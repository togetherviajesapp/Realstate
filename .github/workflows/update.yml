name: Actualizar inmuebles Montevideo

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: self-hosted
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Crear carpeta data
        run: |
          if (!(Test-Path data)) { New-Item -ItemType Directory -Path data | Out-Null }

      - name: Descargar InfoCasas y Gallito
        run: python scraper.py --out data/raw_infocasas_gallito.csv --paginas 5

      - name: Descargar MercadoLibre
        continue-on-error: true
        run: python scraper_ml.py --out data/raw_mercadolibre.csv --paginas 3

      - name: Procesar y actualizar data.json
        run: |
          $FECHA = Get-Date -Format "yyyy-MM-dd"
          if (Test-Path data/raw_mercadolibre.csv) {
            python process.py --csvs data/raw_infocasas_gallito.csv data/raw_mercadolibre.csv --data data.json --fecha $FECHA
          } else {
            python process.py --csvs data/raw_infocasas_gallito.csv --data data.json --fecha $FECHA
          }

      - name: Commitear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/
          git diff --quiet --cached
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizacion semanal de inmuebles $(Get-Date -Format 'yyyy-MM-dd')"
            git push
          } else {
            Write-Host "Sin cambios para commitear"
          }
