name: Actualizar inmuebles Montevideo

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: self-hosted
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install chrome

      - name: Crear carpeta data
        run: |
          if (!(Test-Path data)) { New-Item -ItemType Directory -Path data | Out-Null }

      - name: Descargar InfoCasas y Gallito
        run: python scraper.py --out data/raw_infocasas_gallito.csv --paginas 5

      - name: Descargar MercadoLibre
        continue-on-error: true
        run: python scraper_ml.py --out data/raw_mercadolibre.csv --paginas 3

      - name: Descargar Casasymas
        continue-on-error: true
        run: python scraper_casasymas.py --out data/raw_casasymas.csv --paginas 5

      - name: Procesar y actualizar data.json
        run: |
          $FECHA = Get-Date -Format "yyyy-MM-dd"
          $CSVS = @("data/raw_infocasas_gallito.csv")
          if (Test-Path data/raw_mercadolibre.csv) { $CSVS += "data/raw_mercadolibre.csv" }
          if (Test-Path data/raw_casasymas.csv) { $CSVS += "data/raw_casasymas.csv" }
          python process.py --csvs $CSVS --data data.json --fecha $FECHA

      - name: Generar Excel del reporte
        run: python export_excel.py --data data.json --excel Reporte_Inmuebles_Montevideo.xlsx

      - name: Commitear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/ Reporte_Inmuebles_Montevideo.xlsx
          git diff --quiet --cached
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Actualizacion semanal de inmuebles $(Get-Date -Format 'yyyy-MM-dd')"
            git push
          } else {
            Write-Host "Sin cambios para commitear"
          }
